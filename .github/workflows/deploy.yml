name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      # Chave publicável do widget do alpha-tester (at_pub_...). Sem ela, o site sai sem widget.
      ALPHA_TESTER_API_KEY: ${{ secrets.ALPHA_TESTER_API_KEY }}
      ALPHA_TESTER_ENDPOINT: https://dev.alphatester.app
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy (production on main, preview on pull requests)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}"
          npx --yes wrangler@4 pages deploy out/dist --project-name=seumarketing360 --branch="$branch" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Produção: https://seumarketing360.com.br (só em push na main)" >> "$GITHUB_STEP_SUMMARY"
